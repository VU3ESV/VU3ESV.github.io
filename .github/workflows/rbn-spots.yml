name: Update RBN spots

# Runs every 5 minutes and pulls the last 15 minutes of spots produced
# by LB9KJ as a CW Skimmer node on the Reverse Beacon Network.
#
# GitHub Actions cron is best-effort and is often throttled — actual
# delivery interval may be longer than the configured 5 min during
# busy periods. The page polls raw.githubusercontent.com every 60s,
# so it will reflect each commit within ~1 min of it landing on main.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: [.github/workflows/rbn-spots.yml]

permissions:
  contents: write

concurrency:
  group: rbn-spots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RBN spots and write data/rbn-spots.json
        run: |
          python3 - <<'PY'
          import datetime, json, os, re, urllib.request

          UA = "vu3esv.github.io RBN updater (github.com/VU3ESV)"

          def band(f):
              for lo, hi, label in [
                  (135.7, 137.8, "2200m"), (472, 479, "630m"),
                  (1800, 2000, "160m"), (3500, 4000, "80m"),
                  (5300, 5410, "60m"), (7000, 7300, "40m"),
                  (10100, 10150, "30m"), (14000, 14350, "20m"),
                  (18068, 18168, "17m"), (21000, 21450, "15m"),
                  (24890, 24990, "12m"), (28000, 29700, "10m"),
                  (50000, 54000, "6m"), (144000, 148000, "2m"),
                  (430000, 440000, "70cm"),
              ]:
                  if lo <= f <= hi:
                      return label
              return "?"

          def get(url):
              return urllib.request.urlopen(
                  urllib.request.Request(url, headers={"User-Agent": UA}),
                  timeout=20,
              ).read()

          page = get("https://www.reversebeacon.net/main.php?spotter_call=LB9KJ").decode("utf-8", "replace")
          m = re.search(r'RBN_version_hash\s*=\s*"([a-f0-9]+)"', page)
          ver = m.group(1) if m else "6a2ffe"

          # ma=900 → last 15 minutes; r=100 → up to 100 rows
          raw = json.loads(get(f"https://www.reversebeacon.net/spots.php?h={ver}&cde=LB9KJ&ma=900&s=0&r=100"))

          spots = []
          for sid, t in (raw.get("spots") or {}).items():
              freq = float(t[1])
              spots.append({
                  "id": int(sid),
                  "spotter": t[0],
                  "freq": freq,
                  "dx": t[2],
                  "snr": int(t[3]),
                  "wpm": int(t[4]),
                  "time": t[5],
                  "epoch": int(t[10]),
                  "band": band(freq),
              })
          spots.sort(key=lambda s: s["epoch"], reverse=True)

          out = {
              "updated_iso": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "spotter": "LB9KJ",
              "max_age_minutes": 15,
              "count": len(spots),
              "spots": spots,
          }
          os.makedirs("data", exist_ok=True)
          with open("data/rbn-spots.json", "w") as f:
              json.dump(out, f, indent=2)
          print(f"Wrote {len(spots)} spots (ver_h={ver})")
          PY

      - name: Commit and push if spots changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/rbn-spots.json; then
            echo "No diff."
            exit 0
          fi
          # Skip commit if only updated_iso changed (no new spots).
          if git diff -- data/rbn-spots.json | grep -E '^[+-][^+-]' | grep -vqE '"updated_iso"'; then
            git add data/rbn-spots.json
            git commit -m "Update RBN spots (auto)"
            git pull --rebase --autostash origin main || true
            git push origin main
            echo "Committed."
          else
            git checkout -- data/rbn-spots.json
            echo "Only timestamp changed; skipped."
          fi
